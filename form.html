<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Форма - Задание 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<form method="post">

    <label for="fullname">ФИО:</label>
    <input type="text" id="fullname" name="fullname" placeholder="Введите ФИО" required>

    <label for="phone">Телефон:</label>
    <input type="tel" id="phone" name="phone" placeholder="89826425432">
    <br><br>

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" placeholder="example@mail.ru">

    <label for="birthday">Дата рождения:</label>
    <input type="date" id="birthday" name="birthday">
    <br><br>

    <label>Выберите пол:</label>
    <label><input type="radio" checked name="radio-group-1" value="male"> М</label>
    <label><input type="radio" name="radio-group-1" value="female"> Ж</label>
    <br><br>

    <label for="field-name-3">Любимый язык программирования:</label><br>
    <select name="field-name-3" id="field-name-3" multiple size="8" style="width: 85px">
        <option value="C++">C++</option>
        <option value="Java">Java</option>
        <option value="Python">Python</option>
        <option value="PHP">PHP</option>
        <option value="HTML">HTML</option>
        <option value="C#">C#</option>
        <option value="Pascal">Pascal</option>
        <option value="Javascript">Javascript</option>
    </select>
    <br><br>

    <label for="bio">Биография:</label><br>
    <textarea id="bio" name="bio" placeholder="Текстовое поле"></textarea>
    <br>

    <label>
        <input type="checkbox" name="contract" required>
        С контрактом ознакомлен (а)
    </label>
    <br>

    <input type="submit" value="Сохранить">

</form>

</body>
</html>
